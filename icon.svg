<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- 1e Character Sheet icon (original drawing): a small hooded, bearded old wizard sits on top of a die, puffing a pipe;
       two smoke rings float free above. White silhouette for Owlbear's dark toolbar. -->
  <g fill="#fff">
    <!-- the die: an even isometric cube, three faces split by thin gaps. Pips: left 3, right 2, set clear of the edges; top face plain. -->
    <path fill-rule="evenodd" d="M11 12.4l5.1 2.4-5.1 2.4-5.1-2.4z"/>
    <path fill-rule="evenodd" d="M5.5 15.3l5.2 2.45v5.55l-5.2-2.45z M6.8 17.3a.5.62 0 1 0 .01 0z M8.1 19.3a.5.62 0 1 0 .01 0z M9.4 21.3a.5.62 0 1 0 .01 0z"/>
    <path fill-rule="evenodd" d="M11.3 17.75l5.2-2.45v5.55l-5.2 2.45z M12.6 18.5a.5.62 0 1 0 .01 0z M15.2 20.1a.5.62 0 1 0 .01 0z"/>
    <!-- the wizard, seated on the top face (drawn at 0.8 scale about his seat) -->
    <g transform="translate(10.4 14.6) scale(.78) translate(-10.4 -14.6)">
      <path d="M9.6 4.4c.8 1.5 1.7 2.8 2.7 3.6 .7.7 .9 1.6.9 2.6l.4 4.2H7.6l.4-4.2c.1-1.3.4-2.5 .9-3.4z"/>
      <path d="M10.2 12.5h3.4c.7 0 1.1.6 1 1.2l-.2 1.1H10.2z"/>
      <path d="M9.9 8.4c.8.4 1.6.4 2.2 0 0 1.2-.4 2.3-1.1 3-.7-.7-1.1-1.8-1.1-3z" opacity=".7"/>
      <path d="M12.2 9.7l2.1-.5" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
      <path d="M14.1 8.6h1.3v1.1a.65.65 0 0 1-1.3 0z"/>
    </g>
  </g>
  <!-- two flat smoke rings, floating free -->
  <g fill="none" stroke="#fff" stroke-width="1">
    <ellipse cx="16.4" cy="7.1" rx="1.8" ry=".62"/>
    <ellipse cx="19.3" cy="4.2" rx="2.4" ry=".8"/>
  </g>
</svg>
